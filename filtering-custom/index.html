<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doro Filtering</title>
    <link rel="stylesheet" href="style.css">
    <!-- jQuery本体 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>

<body>
    <div id="wrapper">
        <h1>Doro Filtering</h1>

        <div id="buttons">
            <button value="all" class="current">all</button>
            <button value="red">red</button>
            <button value="blue">blue</button>
            <button value="yellow">yellow</button>
            <button value="gray">gray</button>
            <button value="shirt">doro?</button>
            <button value="jacket">doro??</button>
            <button value="skirt">doro???</button>
            <button value="pants">doro????</button>
        </div>

        <ul id="list">
            <li class="red skirt"><img src="img/doro.png" alt="Doro"></li>
            <li class="gray jacket"><img src="img/doro.png" alt="Doro"></li>
            <li class="yellow shirt"><img src="img/doro.png" alt="Doro"></li>
            <li class="blue skirt"><img src="img/doro.png" alt="Doro"></li>
            <li class="gray pants"><img src="img/doro.png" alt="Doro"></li>
            <li class="red shirt"><img src="img/doro.png" alt="Doro"></li>
            <li class="blue shirt"><img src="img/doro.png" alt="Doro"></li>
            <li class="yellow pants"><img src="img/doro.png" alt="Doro"></li>
            <li class="red jacket"><img src="img/doro.png" alt="Doro"></li>
            <li class="gray shirt"><img src="img/doro.png" alt="Doro"></li>
            <li class="yellow skirt"><img src="img/doro.png" alt="Doro"></li>
            <li class="blue jacket"><img src="img/doro.png" alt="Doro"></li>
        </ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
